name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go Build & Test
    runs-on: ubuntu-latest
    # PostgreSQL for the store, API and integration tests, which skip
    # without HOOKMON_TEST_PG_DSN. Each test makes its own schema and drops
    # it, so packages running in parallel share the database safely.
    services:
      postgres:
        image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: hookmon-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --tmpfs /var/lib/postgresql/data
    env:
      HOOKMON_TEST_PG_DSN: postgres://postgres:hookmon-ci@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
          # Ubuntu's bpftool is a wrapper that needs a linux-tools build for the
          # running kernel, and newer runner kernels ship none. Use a pinned
          # static upstream build instead.
          curl -sSfL -o /tmp/bpftool.tar.gz \
            https://github.com/libbpf/bpftool/releases/download/v7.7.0/bpftool-v7.7.0-amd64.tar.gz
          echo "09150596f09356b0ff632dd7f9856e0ea86bf96b269e9bc94278d9a9432a268c  /tmp/bpftool.tar.gz" | sha256sum -c -
          sudo tar xzf /tmp/bpftool.tar.gz -C /usr/local/bin bpftool
          sudo chmod +x /usr/local/bin/bpftool
          echo "BPFTOOL=/usr/local/bin/bpftool" >> "$GITHUB_ENV"
          /usr/local/bin/bpftool version

      - name: Build all binaries
        run: make build-all

      - name: Vet
        run: go vet ./...

      - name: PostgreSQL tests run, not skip
        run: |
          go test -count=1 -v -run '^TestMigration_FreshDatabase$' ./server/store/ | tee "$RUNNER_TEMP/pg-check.out"
          grep -q -- '--- PASS: TestMigration_FreshDatabase' "$RUNNER_TEMP/pg-check.out"

      - name: Unit, PostgreSQL and integration tests
        run: go test -race -count=1 ./...

      - name: Smoketests
        run: make smoketest

  dashboard:
    name: Dashboard Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: TypeScript check
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Build
        working-directory: dashboard
        run: npx vite build

  appliance:
    name: Compose appliance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: hookmon-ci
      APPLIANCE_HOSTNAME: hookmon.ci.internal
    steps:
      - uses: actions/checkout@v4

      - name: Lint scripts
        run: shellcheck deploy/appliance/hookmon-init.sh deploy/appliance/check-stack.sh test/ci/appliance-bus.sh

      - name: First-run script
        run: |
          dir="$RUNNER_TEMP/hookmon"
          echo "HOOKMON_CONFIG_DIR=$dir" >> "$GITHUB_ENV"
          init() {
            deploy/appliance/hookmon-init.sh --mode compose --out-dir "$dir" \
              --hostname "$APPLIANCE_HOSTNAME" --ip 127.0.0.1
          }
          init
          # A second run keeps every file as it is.
          sums() { find "$dir" -type f -exec sha256sum {} + | sort; }
          before=$(sums)
          init >/dev/null
          if [ "$before" != "$(sums)" ]; then
            echo "a second run of hookmon-init.sh changed files"
            exit 1
          fi

      - name: Start the stack
        run: docker compose -f deploy/appliance/docker-compose.yml up -d --build --wait --wait-timeout 300

      - name: Check the stack
        run: |
          deploy/appliance/check-stack.sh --config-dir "$HOOKMON_CONFIG_DIR" \
            --hostname "$APPLIANCE_HOSTNAME" -- docker compose -f deploy/appliance/docker-compose.yml

      - name: Show the stack
        if: failure()
        run: |
          docker compose -f deploy/appliance/docker-compose.yml ps -a
          docker compose -f deploy/appliance/docker-compose.yml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f deploy/appliance/docker-compose.yml down -v --remove-orphans

  # The dashboard Playwright tests (dashboard/e2e) against a fresh compose
  # appliance with a real sensor bus enrolled into it: root hookmon-bus on
  # the runner, built with its eBPF objects, enrolled with the appliance's
  # token, and fleet learning on, so the pages have a host, events, live
  # events and PENDING entries to show.
  dashboard-e2e:
    name: Dashboard e2e (appliance + bus)
    needs: appliance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: hookmon-dash
      APPLIANCE_HOSTNAME: hookmon.ci.internal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
          # The same pinned static bpftool as the Go job.
          curl -sSfL -o /tmp/bpftool.tar.gz \
            https://github.com/libbpf/bpftool/releases/download/v7.7.0/bpftool-v7.7.0-amd64.tar.gz
          echo "09150596f09356b0ff632dd7f9856e0ea86bf96b269e9bc94278d9a9432a268c  /tmp/bpftool.tar.gz" | sha256sum -c -
          sudo tar xzf /tmp/bpftool.tar.gz -C /usr/local/bin bpftool
          sudo chmod +x /usr/local/bin/bpftool
          echo "BPFTOOL=/usr/local/bin/bpftool" >> "$GITHUB_ENV"
          uname -r
          ls -l /sys/kernel/btf/vmlinux

      - name: Build the sensor bus
        run: make build-bus build-dlopen-probe

      - name: Resolve the appliance name
        run: echo "127.0.0.1 $APPLIANCE_HOSTNAME" | sudo tee -a /etc/hosts

      - name: First-run script
        run: |
          dir="$RUNNER_TEMP/hookmon"
          echo "HOOKMON_CONFIG_DIR=$dir" >> "$GITHUB_ENV"
          deploy/appliance/hookmon-init.sh --mode compose --out-dir "$dir" \
            --hostname "$APPLIANCE_HOSTNAME" --ip 127.0.0.1

      - name: Start the stack
        run: docker compose -f deploy/appliance/docker-compose.yml up -d --build --wait --wait-timeout 300

      - name: Enroll the bus and start learning
        run: |
          test/ci/appliance-bus.sh start --config-dir "$HOOKMON_CONFIG_DIR" \
            --hostname "$APPLIANCE_HOSTNAME" --bus "$PWD/bin/hookmon-bus" --work-dir "$RUNNER_TEMP/bus"

      - name: Install Playwright
        working-directory: dashboard
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright tests
        working-directory: dashboard
        env:
          HOOKMON_E2E_URL: https://${{ env.APPLIANCE_HOSTNAME }}:8443
          HOOKMON_E2E_CA: ${{ runner.temp }}/hookmon/tls/ca.crt
        run: |
          HOOKMON_E2E_TOKEN=$(cat "$HOOKMON_CONFIG_DIR/secrets/api-token")
          export HOOKMON_E2E_TOKEN
          npx playwright test

      - name: Show the stack and the bus
        if: failure()
        run: |
          docker compose -f deploy/appliance/docker-compose.yml ps -a
          docker compose -f deploy/appliance/docker-compose.yml logs --no-color --tail 200
          tail -n 200 "$RUNNER_TEMP/bus/bus.log" || true

      - name: Tear down
        if: always()
        run: |
          test/ci/appliance-bus.sh stop --work-dir "$RUNNER_TEMP/bus" || true
          docker compose -f deploy/appliance/docker-compose.yml down -v --remove-orphans
