name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
          # Ubuntu's bpftool is a wrapper that needs a linux-tools build for the
          # running kernel, and newer runner kernels ship none. Use a pinned
          # static upstream build instead.
          curl -sSfL -o /tmp/bpftool.tar.gz \
            https://github.com/libbpf/bpftool/releases/download/v7.7.0/bpftool-v7.7.0-amd64.tar.gz
          echo "09150596f09356b0ff632dd7f9856e0ea86bf96b269e9bc94278d9a9432a268c  /tmp/bpftool.tar.gz" | sha256sum -c -
          sudo tar xzf /tmp/bpftool.tar.gz -C /usr/local/bin bpftool
          sudo chmod +x /usr/local/bin/bpftool
          echo "BPFTOOL=/usr/local/bin/bpftool" >> "$GITHUB_ENV"
          /usr/local/bin/bpftool version

      - name: Build all binaries
        run: make build-all

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Smoketests
        run: make smoketest

  dashboard:
    name: Dashboard Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: TypeScript check
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Build
        working-directory: dashboard
        run: npx vite build

  appliance:
    name: Compose appliance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: hookmon-ci
      APPLIANCE_HOSTNAME: hookmon.ci.internal
    steps:
      - uses: actions/checkout@v4

      - name: Lint scripts
        run: shellcheck deploy/appliance/hookmon-init.sh deploy/appliance/check-stack.sh

      - name: First-run script
        run: |
          dir="$RUNNER_TEMP/hookmon"
          echo "HOOKMON_CONFIG_DIR=$dir" >> "$GITHUB_ENV"
          init() {
            deploy/appliance/hookmon-init.sh --mode compose --out-dir "$dir" \
              --hostname "$APPLIANCE_HOSTNAME" --ip 127.0.0.1
          }
          init
          # A second run keeps every file as it is.
          sums() { find "$dir" -type f -exec sha256sum {} + | sort; }
          before=$(sums)
          init >/dev/null
          if [ "$before" != "$(sums)" ]; then
            echo "a second run of hookmon-init.sh changed files"
            exit 1
          fi

      - name: Start the stack
        run: docker compose -f deploy/appliance/docker-compose.yml up -d --build --wait --wait-timeout 300

      - name: Check the stack
        run: |
          deploy/appliance/check-stack.sh --config-dir "$HOOKMON_CONFIG_DIR" \
            --hostname "$APPLIANCE_HOSTNAME" -- docker compose -f deploy/appliance/docker-compose.yml

      - name: Show the stack
        if: failure()
        run: |
          docker compose -f deploy/appliance/docker-compose.yml ps -a
          docker compose -f deploy/appliance/docker-compose.yml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f deploy/appliance/docker-compose.yml down -v --remove-orphans
