syntax = "proto3";

package hookmon.v1;

option go_package = "github.com/dlenrow/hookmon/gen/hookmon/v1;hookmonv1";

import "hookmon/v1/events.proto";
import "google/protobuf/timestamp.proto";

service AgentService {
  // StreamEvents is a bidirectional stream for event delivery.
  // Agent sends events; server sends acknowledgements.
  // Served on the mutual-TLS listener. The server takes the host ID from the
  // client certificate's CN and ignores host_id in every message.
  rpc StreamEvents(stream AgentMessage) returns (stream ServerMessage);

  // Enroll registers a new agent with the server. Served only on the
  // enrollment listener, which uses TLS with server authentication only.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

message AgentMessage {
  oneof payload {
    HookEvent event = 1;
    Heartbeat heartbeat = 2;
    ShutdownNotice shutdown = 3;
    Marker marker = 4;
  }
}

// ShutdownNotice is sent when the bus is stopping cleanly (systemctl stop,
// reboot, suspend). The server records it and does not raise AGENT_OFFLINE
// until the bus has been silent longer than expected for that reason.
message ShutdownNotice {
  string reason = 1;  // "shutdown", "suspend", "restart"
}

// Marker is an end-to-end liveness signal sent every 60 seconds through the
// same gRPC stream that carries events. The server records when it arrives.
// Missing for 3 minutes on a host that has not announced a shutdown means
// the bus is wedged.
message Marker {
  google.protobuf.Timestamp timestamp = 1;
}

message ServerMessage {
  oneof payload {
    EventAck ack = 1;
    PolicyUpdate policy_update = 2;
  }
}

message Heartbeat {
  // host_id is informational. Over mutual TLS the server uses the host ID in
  // the client certificate instead.
  string host_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  string agent_version = 3;
  uint64 events_sent = 4;
  uint64 uptime_seconds = 5;
  // sensors is the bus's sensor-registry snapshot, one entry per sensor.
  repeated SensorHealth sensors = 6;
  string kernel_release = 7;
}

// SensorHealth is one sensor's state in the bus's sensor registry.
message SensorHealth {
  string name = 1;
  // status is alive, dead, failed, unverifiable or unknown.
  string status = 2;
  string reason = 3;
}

message EventAck {
  string event_id = 1;
  bool accepted = 2;
}

message PolicyUpdate {
  repeated PolicyRule rules = 1;
}

message PolicyRule {
  string id = 1;
  string action = 2;
  string exe_path = 3;
  string exe_hash = 4;
  string library_path = 5;
  string prog_name = 6;
}

message EnrollRequest {
  string enrollment_token = 1;
  string hostname = 2;
  // csr is a PEM-encoded certificate request. The server signs only its
  // public key; it ignores the requested subject and names.
  bytes csr = 3;
  string os_info = 4;
  string agent_version = 5;
}

message EnrollResponse {
  // host_id is assigned by the server and is the signed certificate's CN.
  string host_id = 1;
  // signed_cert is the PEM-encoded client certificate.
  bytes signed_cert = 2;
  // ca_cert is the PEM-encoded CA certificate that signed it.
  bytes ca_cert = 3;
}
