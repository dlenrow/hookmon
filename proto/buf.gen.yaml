version: v2
plugins:
  # Plugin versions are pinned to match the runtime versions in go.mod
  # (google.golang.org/protobuf v1.36.8, google.golang.org/grpc v1.68.0).
  - remote: buf.build/protocolbuffers/go:v1.36.8
    out: ../gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: ../gen
    opt: paths=source_relative
