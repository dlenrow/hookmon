# Example inventory for appliance/ansible/playbook.yml. One host per server.
#
# hookmon_server_hostname          name buses and browsers use (default: the host's FQDN)
# hookmon_server_ip_addresses      IP SANs (default: the host's default IPv4 address)
# hookmon_server_dns_names         more DNS SANs (default: none)
# hookmon_server_init_extra_args   other hookmon-init.sh options, e.g. ["--token-ttl", "30d"]
# The binary, dashboard and hookmon-init.sh paths on the controller are in
# roles/hookmon_server/defaults/main.yml.

[hookmon_server]
hookmon.example.internal ansible_user=ubuntu ansible_python_interpreter=/usr/bin/python3 hookmon_server_hostname=hookmon.example.internal
