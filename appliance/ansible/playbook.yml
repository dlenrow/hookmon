---
# HookMon server path on an existing Ubuntu 24.04 host: PostgreSQL 16,
# hookmon-server and the dashboard, the same way the appliance image sets
# them up. Build the inputs first, from the repository root:
#
#   make appliance-server build-dashboard
#   ansible-playbook -i inventory.ini appliance/ansible/playbook.yml
#
# inventory.example.ini shows the inventory and the variables. The roles
# change no firewall settings; the last task lists the ports to open.
- name: Deploy the HookMon server
  hosts: hookmon_server
  become: true
  roles:
    - hookmon_postgres
    - hookmon_server
