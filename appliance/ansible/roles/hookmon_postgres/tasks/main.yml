---
# PostgreSQL 16 from Ubuntu 24.04. Ubuntu's default config listens on
# localhost only and needs a password over TCP, which is what hookmon-server
# uses; this role leaves the config alone, so other databases on the host
# are not affected. The hookmon role and database are made by hookmon_server.
- name: Install PostgreSQL 16
  ansible.builtin.apt:
    name:
      - postgresql-16
      - postgresql-client-16
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Start PostgreSQL
  ansible.builtin.systemd_service:
    name: postgresql
    state: started
    enabled: true
