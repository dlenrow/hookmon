# hookmon-server configuration (example).
#
# Install as /etc/hookmon/server.yaml, owned by root, mode 0600: it holds the
# database password and the enrollment secrets. Command-line flags override
# the values here. Unknown keys are an error.

# Mutual-TLS gRPC listener. Buses stream events and heartbeats here; the TLS
# handshake requires a client certificate signed by tls.ca_file, and the
# server takes each bus's host ID from that certificate.
grpc_addr: ":9443"

# Enrollment listener. TLS authenticates the server only, because a bus that
# is enrolling has no certificate yet. Only the Enroll RPC is served here,
# and it needs an enrollment token. Runs only when enrollment.tokens is set.
enroll_addr: ":9444"

# REST API, WebSocket and dashboard, over TLS with tls.cert_file (plain
# HTTP only with tls.insecure). Clients authenticate with an api.tokens
# bearer token; no client certificate is needed here.
http_addr: ":8443"

# The built dashboard (dashboard/dist from npm run build). The server serves
# it on http_addr, falling back to index.html for the dashboard's own
# routes. Empty turns it off; a directory without index.html is skipped with
# a warning.
dashboard_dir: /usr/share/hookmon/dashboard

tls:
  # The server's certificate and key, used on both gRPC listeners and on
  # http_addr. The certificate must name the address buses and browsers
  # dial (DNS or IP SAN).
  cert_file: /etc/hookmon/tls/server.crt
  key_file: /etc/hookmon/tls/server.key
  # The CA that signs bus certificates and verifies them on grpc_addr.
  ca_file: /etc/hookmon/tls/ca.crt
  # That CA's private key. Only enrollment uses it, to sign bus
  # certificates. Keep it root-only.
  ca_key_file: /etc/hookmon/tls/ca.key
  # true runs gRPC and REST without TLS (the --insecure flag does the
  # same). Host IDs are then whatever each bus claims. Enrollment needs TLS,
  # so the server refuses insecure mode while enrollment.tokens is set.
  # Development only. With insecure false and no cert_file, the server
  # refuses to start.
  insecure: false

  # One way to make these files:
  #   openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
  #     -keyout ca.key -out ca.crt -days 3650 -subj "/CN=hookmon CA"
  #   openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
  #     -keyout server.key -out server.csr -subj "/CN=hookmon.internal"
  #   openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
  #     -days 825 -out server.crt \
  #     -extfile <(printf "subjectAltName=DNS:hookmon.internal\nextendedKeyUsage=serverAuth")

database:
  url: "postgres://hookmon:CHANGE-ME@localhost:5432/hookmon?sslmode=disable"

api:
  # Bearer tokens for the REST API and the WebSocket event feed.
  tokens: []
  # Browser origins (scheme://host[:port]), besides the server's own, whose
  # pages may open the WebSocket event feed. Leave it empty when the
  # dashboard is served by this server.
  allowed_origins: []

enrollment:
  # Lifetime of the client certificates the server issues.
  cert_validity: 8760h
  # Enrollment secrets. A bus enrolls once, on first start:
  #   hookmon-bus --enroll-token-file /etc/hookmon/enroll-token \
  #     --server-addr hookmon.internal:9443 --ca-file /path/to/ca.crt
  # (the token file holds the secret, mode 0600, so it stays out of ps)
  # It stores its key and certificate under /var/lib/hookmon and needs no
  # token after that. Each token needs a unique name, a secret of at least
  # 32 characters (openssl rand -hex 32) and an expiry. A single_use token
  # enrolls one host; the server records its use in the database, so it
  # stays used across restarts.
  tokens:
    - name: initial-rollout
      secret: "REPLACE-WITH-openssl-rand-hex-32-OUTPUT-0000000000000000"
      expires: 2026-12-31T00:00:00Z
      single_use: false

watchdog:
  # A host with no heartbeat for heartbeat_timeout is marked UNRESPONSIVE and
  # an AGENT_OFFLINE event is raised. Keep it at least twice the bus's
  # heartbeat_interval (30s by default).
  check_interval: 15s
  heartbeat_timeout: 60s

# SIEM connectors. A connector runs only when its block is present; remove
# the "# " from the ones you want. A connector that cannot start (a syslog
# receiver or Kafka broker that cannot be reached, an Elasticsearch cluster
# that refuses the ILM setup, a bad setting) stops the server at startup.
#
# What each connector receives depends on its min_severity:
#   ALERT (the default) or CRITICAL: alerts. These are events at or above
#     that severity that no allowlist entry allowed. A repeat of the same
#     alert (same host, event type, binary and subject, such as the BPF
#     program tag or the library) within 5 minutes is not sent again.
#   INFO or WARN: an event feed. Every stored event at or above that
#     severity, allowed or not, repeats included.
# Every connector also receives AGENT_OFFLINE (CRITICAL) when a host stops
# sending heartbeats, and AGENT_RECOVERED (INFO) when it resumes.
#
# Delivery settings every connector takes:
#   min_severity    see above (default ALERT)
#   queue_size      events waiting for this connector (default 1024). When
#                   the queue is full, new events for it are dropped and
#                   counted in the log; ingestion never waits for a sink.
#   batch_size      most events per request (default 1 for syslog and
#                   webhook, 100 for splunk, elasticsearch and kafka)
#   flush_interval  longest a partial batch waits (default 1s)
# A failed request is retried twice, after 0.5 s and 1 s, when the failure
# may pass (network error, HTTP 429 or 5xx). Delivery is at least once, so
# a retried batch can arrive twice.
connectors:
  # RFC 5424 syslog with a CEF message. TCP uses octet-counting framing
  # (RFC 6587) unless framing is lf; UDP sends one message per datagram.
  # syslog:
  #   address: siem.example.com:514
  #   protocol: tcp          # tcp or udp
  #   framing: octet-counting
  #   facility: local0
  #   min_severity: ALERT

  # Splunk HTTP Event Collector.
  # splunk:
  #   url: https://splunk.example.com:8088/services/collector/event
  #   token: REPLACE-WITH-HEC-TOKEN
  #   index: security        # empty: the token's default index
  #   source_type: hookmon:event
  #   ca_file: /etc/hookmon/tls/splunk-ca.crt   # if not a system-trusted CA
  #   min_severity: INFO     # the full event feed

  # Elasticsearch _bulk API, one index per day: <index_prefix>-YYYY.MM.DD.
  # At startup the server installs an ILM policy that deletes each daily
  # index delete_after its creation, and an index template that applies it
  # (needs the manage_ilm and manage_index_templates privileges). Set
  # ilm.setup to false to manage them yourself, or on OpenSearch.
  # elasticsearch:
  #   url: https://es.example.com:9200
  #   api_key: REPLACE-WITH-BASE64-ID:KEY   # or username and password
  #   index_prefix: hookmon-events
  #   ca_file: /etc/hookmon/tls/es-ca.crt
  #   ilm:
  #     setup: true
  #     policy: hookmon-events
  #     delete_after: 90d
  #   min_severity: INFO

  # JSON POST. With batch_size 1 each request carries one event as a JSON
  # object; with a larger batch_size, a JSON array of events.
  # webhook:
  #   url: https://hooks.example.com/hookmon
  #   headers:
  #     Authorization: Bearer REPLACE-ME
  #   min_severity: ALERT

  # Kafka, JSON messages keyed by host ID. No TLS or SASL options yet.
  # kafka:
  #   brokers: [kafka1.example.com:9092, kafka2.example.com:9092]
  #   topic: hookmon-events
  #   min_severity: INFO
