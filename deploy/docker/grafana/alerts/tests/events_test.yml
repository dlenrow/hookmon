rule_files:
  - ../hookmon-alerts.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      # Collector healthy throughout.
      - series: 'push_time_seconds{job="hookmon-collector"}'
        values: '0+60x200'
      # h1: healthy host, reachable and all sensors alive.
      - series: 'hookmon_fleet_host_reachable{host="h1"}'
        values: '1x200'
      - series: 'hookmon_fleet_sensor_alive{host="h1",sensor="bpf_syscall"}'
        values: '1x200'
      # h2: host goes unreachable at 5m.
      - series: 'hookmon_fleet_host_reachable{host="h2"}'
        values: '1x5 0x195'
      - series: 'hookmon_fleet_sensor_alive{host="h2",sensor="bpf_syscall"}'
        values: '1x5 0x195'
      # h3: host reachable but sensor dead at 5m.
      - series: 'hookmon_fleet_host_reachable{host="h3"}'
        values: '1x200'
      - series: 'hookmon_fleet_sensor_alive{host="h3",sensor="bpf_syscall"}'
        values: '1x5 0x195'
    alert_rule_test:
      # At 3m: nothing should fire yet (for durations not met).
      - eval_time: 3m
        alertname: HookMonHostUnreachable
        exp_alerts: []
      # At 7m: h2 unreachable for 2m -> fires.
      - eval_time: 7m
        alertname: HookMonHostUnreachable
        exp_alerts:
          - exp_labels: {severity: critical, host: h2}
            exp_annotations:
              summary: "HookMon sensor bus unreachable on h2"
              description: "The HookMon sensor bus on h2 has not responded to polling for 2 minutes. This may indicate the sensor bus was killed or the host is down. Investigate immediately.\n"
      # At 6m: h3 sensor dead for 1m and host reachable -> fires.
      - eval_time: 6m
        alertname: HookMonSensorDead
        exp_alerts:
          - exp_labels: {severity: high, host: h3, sensor: bpf_syscall}
            exp_annotations:
              summary: "HookMon sensor bpf_syscall dead on h3"
              description: "Sensor bpf_syscall on h3 has stopped sending heartbeats while the host is reachable. This sensor is no longer detecting its class of injection events.\n"
      # h2's sensor is also dead, but SensorDead should NOT fire because h2 is unreachable.
      # (The rule excludes hosts where hookmon_fleet_host_reachable != 1.)
