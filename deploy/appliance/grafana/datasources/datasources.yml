# Grafana datasources for the compose appliance. The same uids as
# deploy/docker/grafana/provisioning/datasources/datasources.yml, which the
# dashboard refers to, addressed by compose service name.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
